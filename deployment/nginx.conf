worker_processes auto;

events {
    worker_connections 4096;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    tcp_nopush    on;
    tcp_nodelay   on;
    keepalive_timeout 65;
    keepalive_requests 1000;
    limit_req_status 429;
    limit_conn_status 429;

    # 保护 API 入口；地图瓦片、静态资源不受此限流影响。
    limit_req_zone $binary_remote_addr zone=api_write:10m rate=100r/s;
    limit_conn_zone $binary_remote_addr zone=api_conn:10m;

    upstream tianshui_backend {
        server 127.0.0.1:8000 max_fails=3 fail_timeout=10s;
        keepalive 64;
    }

    server {
        listen 8081;
        server_name localhost;
        # 允许上传较大的遥感影像文件；Django 侧最大限制为 10GB。
        client_max_body_size 10g;

        # Vue 前端构建目录
        # Nginx is unpacked under <project>/runtime, so these paths keep the
        # deployment portable instead of binding it to a fixed drive letter.
        root ../../frontend/dist;
        index index.html;

        # 支持 Vue 路由刷新
        location / {
            try_files $uri $uri/ /index.html;
        }

        # 地图服务需要连续切片请求；仅做代理，不套用提交接口的限流。
        location ~ ^/api/v1/environment/(geoserver/ows/|spatial/(wms|wfs)/) {
            proxy_pass http://tianshui_backend;
            proxy_connect_timeout 30s;
            proxy_send_timeout 10m;
            proxy_read_timeout 10m;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 只有创建 GIS 任务的写入口限流，避免重复点击或重试风暴击穿数据库。
        location ~ ^/api/v1/environment/remote-sensing-images/[0-9a-fA-F-]+/calculate_indices/$ {
            limit_conn api_conn 50;
            limit_req zone=api_write burst=200 nodelay;
            proxy_pass http://tianshui_backend;
            proxy_connect_timeout 30s;
            proxy_send_timeout 10m;
            proxy_read_timeout 10m;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 其余 API 仅做并发连接保护，不把状态查询、下载或地图能力按写请求限流。
        location /api/ {
            limit_conn api_conn 100;
            proxy_pass http://tianshui_backend;
            proxy_connect_timeout 30s;
            proxy_send_timeout 10m;
            proxy_read_timeout 10m;
            proxy_request_buffering off;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Django 上传文件
        location /media/ {
            alias ../../backend/media/;
            expires 7d;
            add_header Cache-Control "public";
        }
    }
}
